[[case]]
name = "startup-valgrind"
sources = ["tests/runtime/startup.c"]
requires = ["_start", "__al_initial_envp", "__al_auxv", "__al_syscall", "__errno_location"]
args = ["arg with spaces", "", "--value=a=b", "expect-valgrind-preload"]
env = { OA_PHASE1_VALUE = "one two", OA_PHASE1_EMPTY = "" }
status = 0
stdout = ""
stderr = ""
oracle = ["abi:sysv-amd64", "abi:elf-tls", "c17:errno", "linux:exec-auxv", "linux:fs-base", "project:runtime-abi"]
backends = ["valgrind"]
[case.skip]
native = "Native execution does not receive Memcheck's injected LD_PRELOAD entry."
qemu = "QEMU user-mode execution does not receive Memcheck's injected LD_PRELOAD entry."

