schema_version = 1

[[deviations]]
function = "atexit"
standard = "C17 7.22.4.2"
choice = "Support exactly 32 pending registrations in the bootstrap runtime."
reason = "The C minimum is available before the allocator exists."

[[deviations]]
function = "close"
standard = "POSIX.1-2024 XSH close"
choice = "Report a Linux EINTR result even though the kernel has already released the descriptor."
reason = "Linux may reuse the descriptor before returning the error; retrying the syscall may close a different file."

[[deviations]]
function = "strerror"
standard = "C17 7.24.6.2"
choice = "Use project-authored C-locale wording for Linux errno values."
reason = "C17 permits implementation-defined wording and callers should not parse the message text."

[[deviations]]
function = "vfprintf"
standard = "C17 7.21.6.8"
choice = "The printf family renders pointers in lowercase hexadecimal with a 0x prefix, including 0x0 for NULL."
reason = "C17 leaves pointer rendering implementation-defined. The same representation can be read by the scanf family."

[[deviations]]
function = "freopen"
standard = "C17 7.21.5.4"
choice = "Reject a NULL pathname with EINVAL after closing the former association."
reason = "Mode changes without a pathname are implementation-defined and are outside the initial byte-stream interface."

[[deviations]]
function = "remquo"
standard = "C17 7.12.10.3"
choice = "Store the signed low seven quotient bits across all three floating widths. Store zero for a NaN result."
reason = "A single modulus across formats gives callers more than the required three bits. C17 leaves the quotient width implementation-defined."

[[deviations]]
function = "fmin"
standard = "C17 7.12.12.3"
choice = "The fmin family returns a quieted signaling NaN and raises FE_INVALID even when the other operand is numeric."
reason = "The arithmetic interface reports signaling inputs explicitly. The generic musl implementation can return the numeric operand in this case."

[[deviations]]
function = "fmax"
standard = "C17 7.12.12.2"
choice = "The fmax family returns a quieted signaling NaN and raises FE_INVALID even when the other operand is numeric."
reason = "The arithmetic interface reports signaling inputs explicitly. The generic musl implementation can return the numeric operand in this case."

[[deviations]]
function = "sqrt"
standard = "C17 7.12.1"
choice = "The math interface declares both MATH_ERRNO and MATH_ERREXCEPT. Each function's specification identifies its errno conditions."
reason = "The project reports domain, pole and range errors through errno where declared. Musl typically reports these through floating exceptions alone."

[[deviations]]
function = "setlocale"
standard = "C17 7.11.1.1"
choice = "The foundation accepts C and POSIX. Other names fail, including through environment selection."
reason = "The current byte and formatting interfaces implement the C locale. The C.UTF-8 locale needs the later wide-character and locale milestone."
