name = "regerror"
header = "regex.h"
prototype = "size_t regerror(int code, const regex_t *restrict expression, char *restrict buffer, size_t size)"
standard = ["POSIX.1-2024 XSH regerror"]
deps = ["memcpy", "strlen"]
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:posix-regex", "diff:glibc", "diff:musl", "suite:libc-test"]
provenance = "original"
semantics = [
  "Return the diagnostic size including the terminating null.",
  "If size is nonzero, copy as much diagnostic text as fits and terminate it.",
]

[abi]
narrow_args = ["edi:s32"]
variadic = false
