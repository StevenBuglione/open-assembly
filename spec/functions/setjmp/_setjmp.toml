name = "_setjmp"
header = "setjmp.h"
prototype = "int _setjmp(jmp_buf env)"
standard = ["Extension ABI _setjmp"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "diff:musl", "reference:lua-posix-abi"]
provenance = "original"
semantics = [
  "Save the same calling context as setjmp and return zero on the first return.",
  "Use the declared returns-twice ABI and preserve the signal mask and floating-point control state.",
]

[abi]
narrow_args = []
variadic = false
