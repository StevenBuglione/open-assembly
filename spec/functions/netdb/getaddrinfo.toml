name = "getaddrinfo"
header = "netdb.h"
prototype = "int getaddrinfo(const char *restrict node, const char *restrict service, const struct addrinfo *restrict hints, struct addrinfo **restrict result)"
standard = ["POSIX.1-2024 XSH getaddrinfo"]
deps = ["__errno_location", "calloc", "clock_gettime", "close", "connect", "fclose", "feof", "fgetc", "fgets", "fopen", "free", "freeaddrinfo", "getsockopt", "inet_pton", "malloc", "memcmp", "memcpy", "poll", "recv", "send", "socket", "strchr", "strcmp", "strlen"]
errno = []
mt_safe = true
as_safe = false
oracles = ["reference:rfc3493", "reference:local-netdb", "reference:rfc1035", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Resolve numeric, local-file and DNS node inputs and numeric or local-file services into an owned IPv4 or IPv6 TCP/UDP address list.",
  "Return zero on success or an EAI error and a null result on failure.",
  "Preserve errno. The resolver supports AI_PASSIVE, AI_CANONNAME, AI_NUMERICHOST, AI_NUMERICSERV, AI_V4MAPPED and AI_ALL.",
]

[abi]
narrow_args = []
variadic = false
