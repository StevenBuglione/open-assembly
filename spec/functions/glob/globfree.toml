name = "globfree"
header = "glob.h"
prototype = "void globfree(glob_t *result)"
standard = ["POSIX.1-2024 XSH globfree"]
deps = ["free"]
errno = []
mt_safe = true
as_safe = false
oracles = ["reference:posix-pathname-expansion", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Release all pathname strings and the vector from a glob result and clear its count and vector.",
  "Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
