name = "posix_spawnattr_setflags"
header = "spawn.h"
prototype = "int posix_spawnattr_setflags(posix_spawnattr_t *restrict attr, short value)"
standard = ["POSIX.1-2024 XSH posix_spawnattr_setflags"]
deps = []
errno = ["EINVAL"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:linux-spawn-abi"]
provenance = "original"
semantics = [
  "Store the selected spawn flags in an initialized attribute object.",
  "Reject an unsupported value with EINVAL and leave the stored field unchanged.",
  "Return zero on success or a positive error number on failure. Preserve errno.",
]

[abi]
narrow_args = ["si:s16"]
variadic = false
