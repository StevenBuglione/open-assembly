name = "setlocale"
header = "locale.h"
prototype = "char *setlocale(int category, const char *locale)"
standard = ["C17 7.11.1.1"]
deps = ["getenv", "strcmp"]
errno = []
mt_safe = false
as_safe = false
oracles = ["reference:c-locale", "reference:locale-environment", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Query or select the C locale for a supported category. Accept the C and POSIX names and return C.",
  "For an empty name, consult LC_ALL, the category variable, and LANG in that order, ignoring empty values and defaulting to C.",
  "An invalid category or unsupported selection returns null without changing the locale or errno.",
]

[abi]
narrow_args = ["edi:s32"]
variadic = false
