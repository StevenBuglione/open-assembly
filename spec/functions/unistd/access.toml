name = "access"
header = "unistd.h"
prototype = "int access(const char *path, int mode)"
standard = ["POSIX.1-2024 XSH access"]
deps = ["__errno_location"]
errno = ["EACCES", "EFAULT", "EINVAL", "EIO", "ELOOP", "ENAMETOOLONG", "ENOENT", "ENOMEM", "ENOTDIR", "EPERM", "EROFS"]
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "diff:musl", "reference:linux-filesystem-time-abi"]
provenance = "original"
semantics = ["Check existence or requested permissions using the real process IDs.", "Preserve errno on success and translate Linux errors."]

[abi]
narrow_args = ["esi:s32"]
variadic = false
