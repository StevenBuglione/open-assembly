name = "fsync"
header = "unistd.h"
prototype = "int fsync(int fd)"
standard = ["POSIX.1-2024 XSH fsync"]
deps = ["__errno_location"]
errno = ["EBADF", "EINTR", "EINVAL", "EIO", "ENOSPC", "EROFS"]
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "diff:musl", "reference:linux-filesystem-time-abi"]
provenance = "original"
semantics = ["Synchronize file contents and metadata through the descriptor.", "Preserve errno on success and translate Linux errors."]

[abi]
narrow_args = ["edi:s32"]
variadic = false
