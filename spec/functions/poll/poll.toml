name = "poll"
header = "poll.h"
prototype = "int poll(struct pollfd fds[], nfds_t count, int timeout)"
standard = ["POSIX.1-2024 XSH poll"]
deps = ["__errno_location"]
errno = ["EFAULT", "EINTR", "EINVAL", "ENOMEM"]
mt_safe = true
as_safe = false
oracles = ["reference:linux-x86-64-network-abi", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Poll the descriptor array for readiness and report returned events.",
  "Return the Linux result or minus one with TLS errno. Preserve errno on success.",
]

[abi]
narrow_args = ["edx:s32"]
variadic = false
