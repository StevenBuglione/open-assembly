name = "ppoll"
header = "poll.h"
prototype = "int ppoll(struct pollfd fds[], nfds_t count, const struct timespec *timeout, const sigset_t *mask)"
standard = ["Extension ABI ppoll"]
deps = ["__errno_location"]
errno = ["EFAULT", "EINTR", "EINVAL", "ENOMEM"]
mt_safe = true
as_safe = false
oracles = ["reference:linux-x86-64-network-abi", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Poll with a temporary signal mask and a copied const timeout.",
  "Return the Linux result or minus one with TLS errno. Preserve errno on success.",
]

[abi]
narrow_args = []
variadic = false
