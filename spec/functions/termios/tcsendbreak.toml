name = "tcsendbreak"
header = "termios.h"
prototype = "int tcsendbreak(int fd, int duration)"
standard = ["POSIX.1-2024 XSH tcsendbreak"]
deps = ["__errno_location"]
errno = ["EBADF", "EINTR", "EIO", "ENOTTY"]
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "diff:musl", "reference:linux-termios-uapi"]
provenance = "original"
semantics = [
  "Request the Linux default serial break for a nonpositive duration.",
  "Request a positive duration in deciseconds, capped at INT_MAX divided by 100.",
  "Preserve errno on success and translate Linux errors.",
]

[abi]
narrow_args = ["edi:s32", "esi:s32"]
variadic = false
