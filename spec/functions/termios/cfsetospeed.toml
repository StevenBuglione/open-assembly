name = "cfsetospeed"
header = "termios.h"
prototype = "int cfsetospeed(struct termios *termios_p, speed_t speed)"
standard = ["POSIX.1-2024 XSH cfsetospeed"]
deps = ["__errno_location"]
errno = ["EINVAL"]
mt_safe = true
as_safe = true
oracles = ["reference:linux-termios-uapi", "reference:posix-terminal-speed"]
provenance = "original"
semantics = [
  "Set the encoded output baud rate without changing unrelated terminal flags.",
  "B0 selects the hangup rate.",
  "Unsupported speed codes leave the record unchanged and return -1 with EINVAL.",
]

[abi]
narrow_args = ["esi:u32"]
variadic = false
