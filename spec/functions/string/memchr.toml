name = "memchr"
header = "string.h"
prototype = "void *memchr(const void *s, int c, size_t n)"
standard = ["C17 7.24.5.1"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "reference:byte-ranges"]
provenance = "original"
semantics = [
  "Search at most n bytes for c converted to unsigned char and return the address of the first match or NULL.",
  "With zero length, access no bytes and return NULL.",
]

[abi]
narrow_args = ["esi:s32"]
variadic = false
