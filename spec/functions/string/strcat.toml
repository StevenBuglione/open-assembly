name = "strcat"
header = "string.h"
prototype = "char *strcat(char *restrict dest, const char *restrict src)"
standard = ["C17 7.24.3.1"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "reference:byte-strings"]
provenance = "original"
semantics = [
  "Append the source through its NUL to the original destination terminator and return dest.",
  "The strings must not overlap and dest must have space for the result.",
]

[abi]
narrow_args = []
variadic = false
