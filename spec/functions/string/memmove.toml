name = "memmove"
header = "string.h"
prototype = "void *memmove(void *dest, const void *src, size_t n)"
standard = ["C17 7.24.2.2"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "reference:byte-ranges"]
provenance = "original"
semantics = [
  "Copy exactly n bytes as though through temporary storage and return dest.",
  "Support overlap in either direction and identical pointers. With zero length, access neither region.",
]

[abi]
narrow_args = []
variadic = false
