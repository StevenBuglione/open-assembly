name = "memcpy"
header = "string.h"
prototype = "void *memcpy(void *restrict dest, const void *restrict src, size_t n)"
standard = ["C17 7.24.2.1"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "reference:byte-ranges"]
provenance = "original"
semantics = [
  "Copy exactly n bytes from src to the disjoint destination and return dest.",
  "Overlapping regions are outside the contract. With zero length, access neither region.",
]

[abi]
narrow_args = []
variadic = false
