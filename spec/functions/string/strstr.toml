name = "strstr"
header = "string.h"
prototype = "char *strstr(const char *haystack, const char *needle)"
standard = ["C17 7.24.5.7"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "reference:byte-strings"]
provenance = "original"
semantics = [
  "Return the first position in haystack matching all nonzero bytes of needle, or NULL.",
  "An empty needle matches at haystack. Do not read beyond either terminator.",
]

[abi]
narrow_args = []
variadic = false
