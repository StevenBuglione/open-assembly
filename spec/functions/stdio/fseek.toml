name = "fseek"
header = "stdio.h"
prototype = "int fseek(FILE *stream, long offset, int whence)"
standard = ["C17 7.21.9.2"]
deps = []
errno = ["EINVAL", "ESPIPE", "EOVERFLOW"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase4-stdio"]
