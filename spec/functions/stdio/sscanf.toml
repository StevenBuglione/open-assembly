name = "sscanf"
header = "stdio.h"
prototype = "int sscanf(const char *restrict src, const char *restrict format, ...)"
standard = ["C17 7.21.6.7"]
deps = ["vsscanf"]
errno = ["EINVAL", "EIO"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase4-stdio"]
provenance = "original"
semantics = [
  "Interpret the Phase 4 integer, byte, string, pointer, count, percent and bracket-set conversions.",
  "Apply widths and assignment suppression. Preserve the first input byte after a matching item.",
  "Return the number of assignments, or EOF if input fails before the first completed conversion.",
  "Unsupported floating or wide conversions report EINVAL.",
]

[abi]
narrow_args = []
variadic = true
