name = "fflush"
header = "stdio.h"
prototype = "int fflush(FILE *stream)"
standard = ["C17 7.21.5.2"]
deps = []
errno = ["EBADF", "EIO", "ESPIPE"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase4-stdio"]
provenance = "original"
semantics = [
  "Flush pending output, or synchronize the buffered read position of a seekable input stream.",
  "A NULL stream flushes all open output streams. Return zero on success or EOF on failure.",
]

[abi]
narrow_args = []
variadic = false
