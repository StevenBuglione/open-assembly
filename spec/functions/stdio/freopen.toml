name = "freopen"
header = "stdio.h"
prototype = "FILE * freopen(const char *restrict path, const char *restrict mode, FILE *restrict stream)"
standard = ["C17 7.21.5.4"]
deps = ["free", "close"]
errno = ["EINVAL", "ENOENT", "EACCES"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase4-stdio"]
provenance = "original"
semantics = [
  "Close the existing association, then associate stream with the opened file and reset its buffering and indicators.",
  "Return stream on success. Return NULL on failure. A NULL pathname is unsupported and sets EINVAL.",
]

[abi]
narrow_args = []
variadic = false
