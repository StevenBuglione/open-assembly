name = "getc_unlocked"
header = "stdio.h"
prototype = "int getc_unlocked(FILE *stream)"
standard = ["POSIX.1-2024 XSH getc_unlocked"]
deps = []
errno = ["EBADF", "EIO"]
mt_safe = false
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:linux-busybox-abi"]
provenance = "original"
semantics = [
  "Read one byte with getc semantics without acquiring the stdio lock.",
  "The caller is responsible for synchronization with other operations on the stream.",
]

[abi]
narrow_args = []
variadic = false
