name = "ungetc"
header = "stdio.h"
prototype = "int ungetc(int c, FILE *stream)"
standard = ["C17 7.21.7.10"]
deps = []
errno = ["EBADF"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase4-stdio"]
provenance = "original"
semantics = [
  "Push back one byte for the next read and clear EOF. Return the pushed byte as int.",
  "EOF or a second pending byte fails with EOF and preserves the existing pushback.",
]

[abi]
narrow_args = ["edi:s32"]
variadic = false
