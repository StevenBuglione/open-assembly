name = "fread"
header = "stdio.h"
prototype = "size_t fread(void *restrict dest, size_t size, size_t count, FILE *restrict stream)"
standard = ["C17 7.21.8.1"]
deps = []
errno = ["EOVERFLOW", "EBADF", "EIO"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase4-stdio"]
provenance = "original"
semantics = [
  "Read up to count elements of size bytes and return the number of complete elements.",
  "Zero size or count touches no data. An unrepresentable byte total fails with EOVERFLOW.",
]

[abi]
narrow_args = []
variadic = false
