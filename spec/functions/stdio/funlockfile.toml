name = "funlockfile"
header = "stdio.h"
prototype = "void funlockfile(FILE *stream)"
standard = ["POSIX.1-2024 XSH funlockfile"]
deps = ["__errno_location"]
errno = []
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:stream-ownership"]
provenance = "original"
semantics = [
  "Release one level of explicit stream ownership by its current owner.",
  "Release the stream lock when the depth becomes zero. Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
