name = "sprintf"
header = "stdio.h"
prototype = "int sprintf(char *restrict dest, const char *restrict format, ...)"
standard = ["C17 7.21.6.6"]
deps = ["vsprintf"]
errno = ["EINVAL", "EOVERFLOW", "EIO"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase4-stdio"]
provenance = "original"
semantics = [
  "Interpret the integer, floating, string, byte, pointer, count, and percent conversions.",
  "Return the byte count excluding the terminator on success, or a negative result on error.",
  "Unsupported wide conversions report EINVAL. Count overflow reports EOVERFLOW.",
]

[abi]
narrow_args = []
variadic = true
