name = "snprintf"
header = "stdio.h"
prototype = "int snprintf(char *restrict dest, size_t size, const char *restrict format, ...)"
standard = ["C17 7.21.6.5"]
deps = ["vsnprintf"]
errno = ["EINVAL", "EOVERFLOW", "EIO"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase4-stdio"]
provenance = "original"
semantics = [
  "Interpret the Phase 4 integer, string, byte, pointer, count, and percent conversions.",
  "Return the byte count excluding the terminator on success, or a negative result on error.",
  "Unsupported floating or wide conversions report EINVAL. Count overflow reports EOVERFLOW.",
  "Write at most size-1 bytes and terminate when size is nonzero. Return the full untruncated count. With size zero dest may be NULL.",
]

[abi]
narrow_args = []
variadic = true
