name = "vsnprintf"
header = "stdio.h"
prototype = "int vsnprintf(char *restrict dest, size_t size, const char *restrict format, va_list args)"
standard = ["C17 7.21.6.12"]
deps = []
errno = ["EINVAL", "EOVERFLOW", "EIO"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase4-stdio"]
provenance = "original"
semantics = [
  "Interpret the integer, floating, string, byte, pointer, count, and percent conversions.",
  "Return the byte count excluding the terminator on success, or a negative result on error.",
  "Unsupported wide conversions report EINVAL. Count overflow reports EOVERFLOW.",
  "Write at most size-1 bytes and terminate when size is nonzero. Return the full untruncated count. With size zero dest may be NULL.",
]

[abi]
narrow_args = []
variadic = false
