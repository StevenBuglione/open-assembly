name = "vsprintf"
header = "stdio.h"
prototype = "int vsprintf(char *restrict dest, const char *restrict format, va_list args)"
standard = ["C17 7.21.6.13"]
deps = ["vsnprintf"]
errno = ["EILSEQ", "EINVAL", "EOVERFLOW", "EIO"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase4-stdio"]
provenance = "original"
semantics = [
  "Interpret the integer, floating, string, byte, pointer, count, and percent conversions.",
  "Return the byte count excluding the terminator on success, or a negative result on error.",
  "Wide c and s encode arguments with the active LC_CTYPE. String precision limits complete multibyte characters by byte count. Count overflow reports EOVERFLOW.",
]

[abi]
narrow_args = []
variadic = false
