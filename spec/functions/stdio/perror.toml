name = "perror"
header = "stdio.h"
prototype = "void perror(const char *s)"
standard = ["C17 7.21.10.4"]
deps = ["__errno_location", "strerror", "strlen"]
errno = []
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase4-stdio"]
provenance = "original"
semantics = [
  "Write the current C-locale errno message to stderr and append a newline.",
  "Precede the message with s and colon-space when s is nonempty.",
]

[abi]
narrow_args = []
variadic = false
