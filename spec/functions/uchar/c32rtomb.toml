name = "c32rtomb"
header = "uchar.h"
prototype = "size_t c32rtomb(char *restrict s, char32_t c32, mbstate_t *restrict ps)"
standard = ["C17 7.28.1.4"]
deps = ["__errno_location"]
errno = ["EILSEQ"]
mt_safe = true
as_safe = false
oracles = ["reference:unicode-scalar", "reference:mbstate-transition", "diff:glibc"]
provenance = "original"
semantics = [
  "Encode a Unicode scalar value in the current LC_CTYPE using the restartable multibyte state.",
  "Clear the affected state on an encoding error. Preserve errno for successful or incomplete conversions.",
]

[abi]
narrow_args = ["esi:u32"]
variadic = false
