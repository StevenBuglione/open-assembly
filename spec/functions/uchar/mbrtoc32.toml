name = "mbrtoc32"
header = "uchar.h"
prototype = "size_t mbrtoc32(char32_t *restrict pc32, const char *restrict s, size_t n, mbstate_t *restrict ps)"
standard = ["C17 7.28.1.3"]
deps = ["__errno_location"]
errno = ["EILSEQ"]
mt_safe = true
as_safe = false
oracles = ["reference:unicode-scalar", "reference:mbstate-transition", "diff:glibc"]
provenance = "original"
semantics = [
  "Decode one scalar value into UTF-32 using the restartable multibyte state and current LC_CTYPE.",
  "Clear the affected state on an encoding error. Preserve errno for successful or incomplete conversions.",
]

[abi]
narrow_args = []
variadic = false
