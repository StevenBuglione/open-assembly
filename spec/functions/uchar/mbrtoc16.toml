name = "mbrtoc16"
header = "uchar.h"
prototype = "size_t mbrtoc16(char16_t *restrict pc16, const char *restrict s, size_t n, mbstate_t *restrict ps)"
standard = ["C17 7.28.1.1"]
deps = ["__errno_location"]
errno = ["EILSEQ"]
mt_safe = true
as_safe = false
oracles = ["reference:unicode-scalar", "reference:mbstate-transition", "diff:glibc"]
provenance = "original"
semantics = [
  "Decode one scalar into UTF-16. Emit a queued low surrogate with (size_t)-3 and consume no input on that call.",
  "Clear the affected state on an encoding error. Preserve errno for successful or incomplete conversions.",
]

[abi]
narrow_args = []
variadic = false
