name = "tanhf"
header = "math.h"
prototype = "float tanhf(float x)"
standard = ["C17 7.12.5.6"]
deps = ["fegetround", "feraiseexcept", "__errno_location"]
errno = ["ERANGE"]
mt_safe = true
as_safe = false
oracles = ["reference:mpfr", "reference:fixed-point-interval", "diff:glibc"]
provenance = "original"
semantics = [
  "Compute the hyperbolic tangent of x in the active rounding mode.",
  "Preserve signed zero and return signed one for infinity.",
  "Quiet signaling NaNs and raise FE_INVALID. Overflow or an inexact tiny result reports ERANGE with the corresponding flags.",
]

[abi]
narrow_args = []
variadic = false
