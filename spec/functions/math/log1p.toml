name = "log1p"
header = "math.h"
prototype = "double log1p(double x)"
standard = ["C17 7.12.6.9"]
deps = ["fegetround", "feraiseexcept", "__errno_location"]
errno = ["EDOM", "ERANGE"]
mt_safe = true
as_safe = false
oracles = ["reference:mpfr", "reference:fixed-point-interval", "diff:glibc"]
provenance = "original"
semantics = [
  "Compute the natural logarithm of one plus x in the active rounding mode, retaining the correction near zero.",
  "Preserve signed zero. At minus one return negative infinity with ERANGE and FE_DIVBYZERO. Below minus one return a quiet NaN with EDOM and FE_INVALID.",
  "Positive infinity stays infinity. Signaling NaNs are quieted with FE_INVALID. An inexact tiny result raises FE_UNDERFLOW and FE_INEXACT with ERANGE.",
]

[abi]
narrow_args = []
variadic = false
