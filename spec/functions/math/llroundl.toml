name = "llroundl"
header = "math.h"
prototype = "long long llroundl(long double x)"
standard = ["C17 7.12.9.7"]
deps = ["__errno_location", "feraiseexcept"]
errno = ["EDOM"]
mt_safe = true
as_safe = true
oracles = ["reference:mpfr", "reference:ieee-bits", "diff:glibc"]
provenance = "original"
semantics = [
  "Choose the nearest integer with ties away from zero and preserve FE_INEXACT.",
