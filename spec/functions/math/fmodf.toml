name = "fmodf"
header = "math.h"
prototype = "float fmodf(float x, float y)"
standard = ["C17 7.12.10.1"]
deps = ["__errno_location", "feraiseexcept"]
errno = ["EDOM"]
mt_safe = true
as_safe = true
oracles = ["reference:mpfr", "reference:ieee-bits", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the exact remainder with the sign of x, using a quotient truncated toward zero.",
  "A zero divisor or infinite dividend reports EDOM and FE_INVALID and returns a quiet NaN. A NaN operand takes precedence over those domain errors.",
]

[abi]
narrow_args = []
variadic = false
