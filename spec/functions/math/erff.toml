name = "erff"
header = "math.h"
prototype = "float erff(float x)"
standard = ["C17 7.12.8.1"]
deps = ["fegetround", "feraiseexcept", "__errno_location"]
errno = ["ERANGE"]
mt_safe = true
as_safe = false
oracles = ["reference:mpfr", "reference:fixed-point-interval", "diff:glibc"]
provenance = "original"
semantics = [
  "Compute the error function in the active rounding mode.",
  "Preserve signed zero and return signed one for infinity.",
  "Quiet signaling NaNs and raise FE_INVALID. A tiny inexact result raises FE_UNDERFLOW and FE_INEXACT with ERANGE.",
]

[abi]
narrow_args = []
variadic = false
