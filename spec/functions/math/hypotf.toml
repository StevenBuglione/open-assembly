name = "hypotf"
header = "math.h"
prototype = "float hypotf(float x, float y)"
standard = ["C17 7.12.7.3"]
deps = ["fegetround", "feraiseexcept", "__errno_location"]
errno = ["ERANGE"]
mt_safe = true
as_safe = false
oracles = ["reference:mpfr", "reference:exact-rational", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the square root of the exact sum of squares rounded in the active mode. Intermediate range is unbounded.",
  "Return positive infinity for an infinite operand, including when the other operand is a quiet NaN.",
  "A signaling NaN is quieted and raises FE_INVALID. Overflow or a tiny inexact result reports ERANGE and raises the corresponding flags.",
]

[abi]
narrow_args = []
variadic = false
