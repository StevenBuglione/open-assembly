name = "fdimf"
header = "math.h"
prototype = "float fdimf(float x, float y)"
standard = ["C17 7.12.12.1"]
deps = ["fmaf", "feraiseexcept", "__errno_location"]
errno = ["ERANGE"]
mt_safe = true
as_safe = false
oracles = ["reference:mpfr", "reference:exact-rational", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the positive difference x minus y rounded once in the active mode. Return positive zero when x is no greater than y.",
  "Propagate NaNs and report ERANGE for overflow. A signaling NaN raises FE_INVALID.",
]

[abi]
narrow_args = []
variadic = false
