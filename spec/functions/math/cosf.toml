name = "cosf"
header = "math.h"
prototype = "float cosf(float x)"
standard = ["C17 7.12.4.5"]
deps = ["fegetround", "feraiseexcept", "__errno_location"]
errno = ["EDOM", "ERANGE"]
mt_safe = true
as_safe = false
oracles = ["reference:mpfr", "reference:fixed-point-interval", "diff:glibc"]
provenance = "original"
semantics = [
  "Compute the cos of x in radians and use the active rounding mode.",
  "Return positive one for either zero. An infinite operand yields a quiet NaN with EDOM and FE_INVALID.",
  "Quiet NaNs propagate. A signaling NaN is quieted with FE_INVALID. An inexact tiny result raises FE_UNDERFLOW and FE_INEXACT with ERANGE.",
]

[abi]
narrow_args = []
variadic = false
