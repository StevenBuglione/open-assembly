name = "tanl"
header = "math.h"
prototype = "long double tanl(long double x)"
standard = ["C17 7.12.4.7"]
deps = ["fegetround", "feraiseexcept", "__errno_location"]
errno = ["EDOM", "ERANGE"]
mt_safe = true
as_safe = false
oracles = ["reference:mpfr", "reference:fixed-point-interval", "diff:glibc"]
provenance = "original"
semantics = [
  "Compute the tangent of x in radians and use the active rounding mode.",
  "Preserve the sign of a zero input. An infinite operand yields a quiet NaN with EDOM and FE_INVALID.",
  "Quiet NaNs propagate. A signaling NaN is quieted with FE_INVALID. Overflow or a tiny inexact result reports ERANGE with the corresponding flags.",
]

[abi]
narrow_args = []
variadic = false
