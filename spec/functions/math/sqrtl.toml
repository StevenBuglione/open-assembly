name = "sqrtl"
header = "math.h"
prototype = "long double sqrtl(long double x)"
standard = ["C17 7.12.7.5"]
deps = ["feraiseexcept", "__errno_location"]
errno = ["EDOM"]
mt_safe = true
as_safe = true
oracles = ["reference:mpfr", "reference:ieee-bits", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the square root rounded in the active mode. Preserve signed zero.",
  "Negative nonzero x gives a quiet NaN, raises FE_INVALID and sets EDOM. A signaling NaN is quieted and raises invalid.",
]

[abi]
narrow_args = []
variadic = false
