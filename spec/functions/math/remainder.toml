name = "remainder"
header = "math.h"
prototype = "double remainder(double x, double y)"
standard = ["C17 7.12.10.2"]
deps = ["__errno_location", "feraiseexcept"]
errno = ["EDOM"]
mt_safe = true
as_safe = true
oracles = ["reference:mpfr", "reference:ieee-bits", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the exact remainder with a quotient rounded to nearest integer, with ties to even, independently of the active rounding mode.",
  "Preserve the sign of x for a zero result. A zero divisor or infinite dividend reports EDOM and FE_INVALID unless an operand is NaN.",
]

[abi]
narrow_args = []
variadic = false
