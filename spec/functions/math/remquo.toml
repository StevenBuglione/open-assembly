name = "remquo"
header = "math.h"
prototype = "double remquo(double x, double y, int *quo)"
standard = ["C17 7.12.10.3"]
deps = ["__errno_location", "feraiseexcept"]
errno = ["EDOM"]
mt_safe = true
as_safe = true
oracles = ["reference:mpfr", "reference:ieee-bits", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the same remainder as remainder and store the signed low seven bits of its integral quotient through quo.",
  "On a NaN result store zero through quo. A zero divisor or infinite dividend reports EDOM and FE_INVALID unless an operand is NaN.",
]

[abi]
narrow_args = []
variadic = false
