name = "rintl"
header = "math.h"
prototype = "long double rintl(long double x)"
standard = ["C17 7.12.9.4"]
deps = ["feraiseexcept", "fegetround"]
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:mpfr", "reference:ieee-bits", "diff:glibc"]
provenance = "original"
semantics = [
