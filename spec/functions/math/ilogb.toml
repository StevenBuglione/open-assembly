name = "ilogb"
header = "math.h"
prototype = "int ilogb(double x)"
standard = ["C17 7.12.6.5"]
deps = ["feraiseexcept", "__errno_location"]
errno = ["EDOM"]
mt_safe = true
as_safe = true
oracles = ["reference:mpfr", "reference:ieee-bits", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the exact base-two exponent of the leading bit for finite nonzero x.",
  "Return INT_MIN for zero or NaN and INT_MAX for infinity. These cases set EDOM and raise FE_INVALID.",
]

[abi]
narrow_args = []
variadic = false
