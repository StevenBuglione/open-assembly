name = "cbrtl"
header = "math.h"
prototype = "long double cbrtl(long double x)"
standard = ["C17 7.12.7.1"]
deps = ["fegetround", "feraiseexcept"]
errno = []
mt_safe = true
as_safe = false
oracles = ["reference:mpfr", "reference:exact-rational", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the real cube root, rounded in the active mode. Preserve zero and infinity signs.",
  "A finite inexact result raises FE_INEXACT. A signaling NaN is quieted and raises FE_INVALID.",
]

[abi]
narrow_args = []
variadic = false
