name = "lgammaf"
header = "math.h"
prototype = "float lgammaf(float x)"
standard = ["C17 7.12.8.3"]
deps = ["fegetround", "feraiseexcept", "__errno_location"]
errno = ["ERANGE"]
mt_safe = true
as_safe = false
oracles = ["reference:mpfr", "reference:fixed-point-interval", "diff:glibc"]
provenance = "original"
semantics = [
  "Compute the natural logarithm of the absolute gamma value. Use the active rounding mode.",
  "Zero and negative integers return positive infinity with ERANGE and FE_DIVBYZERO. Either infinite input returns positive infinity.",
  "Quiet signaling NaNs with FE_INVALID. Overflow or a tiny inexact result reports ERANGE with the corresponding flags.",
]

[abi]
narrow_args = []
variadic = false
