name = "modf"
header = "math.h"
prototype = "double modf(double x, double *iptr)"
standard = ["C17 7.12.6.12"]
deps = ["feraiseexcept"]
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:mpfr", "reference:ieee-bits", "diff:glibc"]
provenance = "original"
semantics = [
  "Store the integral part through iptr and return the fractional part. Preserve both signs, including zero.",
  "Infinity has a signed zero fractional part. NaN propagates to both results.",
]

[abi]
narrow_args = []
variadic = false
