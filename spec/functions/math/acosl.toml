name = "acosl"
header = "math.h"
prototype = "long double acosl(long double x)"
standard = ["C17 7.12.4.1"]
deps = ["fegetround", "feraiseexcept", "__errno_location"]
errno = ["EDOM", "ERANGE"]
mt_safe = true
as_safe = false
oracles = ["reference:mpfr", "reference:fixed-point-interval", "diff:glibc"]
provenance = "original"
semantics = [
  "Compute the acos of x in radians and use the active rounding mode.",
  "For positive one return positive zero. Either zero returns half pi. Magnitudes above one report EDOM and FE_INVALID with a quiet NaN.",
  "Signaling NaNs are quieted with FE_INVALID. A tiny inexact result raises FE_UNDERFLOW and FE_INEXACT with ERANGE.",
]

[abi]
narrow_args = []
variadic = false
