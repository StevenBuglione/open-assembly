name = "ldexpl"
header = "math.h"
prototype = "long double ldexpl(long double x, int n)"
standard = ["C17 7.12.6.6"]
deps = ["feraiseexcept", "__errno_location", "fegetround"]
errno = ["ERANGE"]
mt_safe = true
as_safe = true
oracles = ["reference:mpfr", "reference:ieee-bits", "diff:glibc"]
provenance = "original"
semantics = [
  "Multiply x by two raised to the int exponent and round in the active mode.",
  "Overflow or a tiny inexact result sets ERANGE and raises the corresponding flags. Exact scaling preserves errno.",
]

[abi]
narrow_args = ["edi:s32"]
variadic = false
