name = "fmaxl"
header = "math.h"
prototype = "long double fmaxl(long double x, long double y)"
standard = ["C17 7.12.12.2"]
deps = ["feraiseexcept"]
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:mpfr", "reference:ieee-bits", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the greater numeric operand and select positive zero when the two zeros have different signs.",
  "Ignore one quiet NaN in favor of a numeric operand. Quiet and return a signaling NaN with FE_INVALID. If both are quiet NaNs, return the first.",
]

[abi]
narrow_args = []
variadic = false
