name = "nextafter"
header = "math.h"
prototype = "double nextafter(double x, double y)"
standard = ["C17 7.12.11.3"]
deps = ["feraiseexcept", "__errno_location"]
errno = ["ERANGE"]
mt_safe = true
as_safe = true
oracles = ["reference:mpfr", "reference:ieee-bits", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the next representable value after x in the direction of y, independently of the rounding mode.",
  "If x and y compare equal return y, including its sign of zero. A step into subnormal range or from finite to infinity sets ERANGE and the corresponding flags.",
]

[abi]
narrow_args = []
variadic = false
