name = "wcstof"
header = "wchar.h"
prototype = "float wcstof(const wchar_t *restrict s, wchar_t **restrict endptr)"
standard = ["C17 7.29.4.1.1"]
deps = ["fegetround", "feraiseexcept", "__errno_location", "iswspace"]
errno = ["ERANGE"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "reference:mpfr"]
provenance = "original"
semantics = [
  "Consume wide whitespace in the active LC_CTYPE, optional sign, and the longest valid decimal, hexadecimal, infinity or NaN subject.",
  "Round the exact magnitude directly to binary32 using the current floating-point rounding mode.",
  "Set endptr to the first unconsumed wide character when provided. On no conversion return positive zero and set endptr to s.",
  "Preserve errno for exact results, ordinary inexact normal results, and no conversion.",
  "Raise inexact for rounding, plus overflow or underflow where applicable. Set ERANGE on overflow or an inexact tiny result.",
  "Preserve the sign of zero and infinity. Accept a valid NaN payload and return a canonical quiet NaN.",
]

[abi]
narrow_args = []
variadic = false
