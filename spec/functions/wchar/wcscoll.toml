name = "wcscoll"
header = "wchar.h"
prototype = "int wcscoll(const wchar_t *a, const wchar_t *b)"
standard = ["C17 7.29.4.4.2"]
deps = ["wcscmp"]
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:wide-object-bounds", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Compare wide strings in code-point order in both supported locales.",
  "Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
