name = "wcsncat"
header = "wchar.h"
prototype = "wchar_t *wcsncat(wchar_t *restrict dst, const wchar_t *restrict src, size_t n)"
standard = ["C17 7.29.4.3.2"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:wide-object-bounds", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Append at most n non-null wide elements and write one terminating null.",
  "Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
