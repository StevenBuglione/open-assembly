name = "mbsrtowcs"
header = "wchar.h"
prototype = "size_t mbsrtowcs(wchar_t *restrict dst, const char **restrict src, size_t len, mbstate_t *restrict ps)"
standard = ["C17 7.29.6.4.1"]
deps = ["__errno_location"]
errno = ["EILSEQ"]
mt_safe = true
as_safe = false
oracles = ["reference:unicode-scalar", "reference:mbstate-transition", "diff:glibc"]
provenance = "original"
semantics = [
  "Convert the null-terminated byte sequence to wide characters. Count-only calls preserve both source pointer and state. A writing call advances to the next byte sequence or stores null at the end.",
  "Return minus one and set EILSEQ on invalid input. Preserve errno on success.",
]

[abi]
narrow_args = []
variadic = false
