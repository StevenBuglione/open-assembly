name = "wcschr"
header = "wchar.h"
prototype = "wchar_t *wcschr(const wchar_t *s, wchar_t c)"
standard = ["C17 7.29.4.5.1"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:wide-object-bounds", "diff:glibc", "diff:musl"]
