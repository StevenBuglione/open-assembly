name = "wcstok"
header = "wchar.h"
prototype = "wchar_t *wcstok(wchar_t *restrict s, const wchar_t *restrict separators, wchar_t **restrict context)"
standard = ["C17 7.29.4.5.7"]
deps = ["wcscspn", "wcsspn"]
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:wide-object-bounds", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Return the next token and keep the continuation in the caller's context.",
  "Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
