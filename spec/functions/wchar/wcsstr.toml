name = "wcsstr"
header = "wchar.h"
prototype = "wchar_t *wcsstr(const wchar_t *haystack, const wchar_t *needle)"
standard = ["C17 7.29.4.5.6"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:wide-object-bounds", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Find the first matching wide substring. An empty needle matches at the start.",
  "Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
