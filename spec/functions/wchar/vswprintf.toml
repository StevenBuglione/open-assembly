name = "vswprintf"
header = "wchar.h"
prototype = "int vswprintf(wchar_t *restrict dest, size_t size, const wchar_t *restrict format, va_list args)"
standard = ["C17 7.29.2.7"]
deps = []
errno = ["EILSEQ", "EINVAL", "EIO", "EOVERFLOW"]
mt_safe = true
as_safe = false
oracles = ["reference:c17-wide-stdio", "reference:sysv-amd64", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Interpret C17 wide format conversions, with widths, precisions and counts in wide characters.",
  "Return the number of wide characters written or a negative value on failure.",
  "Reserve space for a terminating wide null. A result that does not fit returns a negative value.",
]

[abi]
narrow_args = []
variadic = false
