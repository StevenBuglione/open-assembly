name = "wcscpy"
header = "wchar.h"
prototype = "wchar_t *wcscpy(wchar_t *restrict dst, const wchar_t *restrict src)"
standard = ["C17 7.29.4.2.1"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:wide-object-bounds", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Copy the wide string and its terminating null.",
  "Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
