name = "wmemcmp"
header = "wchar.h"
prototype = "int wmemcmp(const wchar_t *a, const wchar_t *b, size_t n)"
standard = ["C17 7.29.4.4.5"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:wide-object-bounds", "diff:glibc", "diff:musl"]
