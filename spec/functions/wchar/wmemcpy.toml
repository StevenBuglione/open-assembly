name = "wmemcpy"
header = "wchar.h"
prototype = "wchar_t *wmemcpy(wchar_t *restrict dst, const wchar_t *restrict src, size_t n)"
standard = ["C17 7.29.4.2.3"]
deps = ["memcpy"]
errno = []
mt_safe = true
as_safe = true
oracles = ["reference:wide-object-bounds", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Copy exactly n wide elements in disjoint objects.",
  "Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
