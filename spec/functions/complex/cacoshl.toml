name = "cacoshl"
header = "complex.h"
prototype = "long double _Complex cacoshl(long double _Complex z)"
standard = ["C17 7.3.6.1"]
deps = ["fegetround", "feraiseexcept", "__errno_location"]
errno = ["ERANGE"]
mt_safe = true
as_safe = false
oracles = ["reference:mpfr", "reference:complex-branch-cut", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the complex arc hyperbolic cosine on the principal branch, preserving the input side of the branch cut and the floating control state.",
  "On the zero-real NaN case, return a quiet NaN real part and an imaginary magnitude of pi over two, as resolved by WG14 DR 471.",
]

