name = "carg"
header = "complex.h"
prototype = "double carg(double _Complex z)"
standard = ["C17 7.3.9.1"]
deps = ["atan2"]
errno = ["ERANGE"]
mt_safe = true
as_safe = false
oracles = ["reference:ieee-bits", "reference:mpfr", "diff:glibc"]
provenance = "original"
semantics = [
  "Return the signed angle in radians with the quadrant, signed-zero and exception rules of atan2 of imaginary and real.",
]

[abi]
narrow_args = []
variadic = false
