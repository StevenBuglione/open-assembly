name = "listen"
header = "sys/socket.h"
prototype = "int listen(int fd, int backlog)"
standard = ["POSIX.1-2024 XSH listen"]
deps = ["__errno_location"]
errno = ["EADDRINUSE", "EBADF", "ENOTSOCK", "EOPNOTSUPP"]
mt_safe = true
as_safe = false
oracles = ["reference:linux-x86-64-network-abi", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Mark a socket as listening with the supplied backlog.",
  "Return the Linux result or minus one with TLS errno. Preserve errno on success.",
]

[abi]
narrow_args = ["edi:s32", "esi:s32"]
variadic = false
