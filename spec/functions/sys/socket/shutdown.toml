name = "shutdown"
header = "sys/socket.h"
prototype = "int shutdown(int fd, int how)"
standard = ["POSIX.1-2024 XSH shutdown"]
deps = ["__errno_location"]
errno = ["EBADF", "EINVAL", "ENOTCONN", "ENOTSOCK"]
mt_safe = true
as_safe = false
oracles = ["reference:linux-x86-64-network-abi", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Shut down the selected directions of the connection.",
  "Return the Linux result or minus one with TLS errno. Preserve errno on success.",
]

[abi]
narrow_args = ["edi:s32", "esi:s32"]
variadic = false
