name = "epoll_create"
header = "sys/epoll.h"
prototype = "int epoll_create(int size)"
standard = ["Extension ABI epoll_create"]
deps = ["__errno_location"]
errno = ["EINVAL", "EMFILE", "ENFILE", "ENOMEM"]
mt_safe = true
as_safe = false
oracles = ["reference:linux-x86-64-network-abi", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Create an epoll instance using the legacy positive size argument.",
  "Return the Linux result or minus one with TLS errno. Preserve errno on success.",
]

[abi]
narrow_args = ["edi:s32"]
variadic = false
