name = "raise"
header = "signal.h"
prototype = "int raise(int sig)"
standard = ["C17 7.14.2.1"]
deps = ["getpid", "__errno_location"]
errno = ["EINVAL", "ESRCH"]
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "diff:musl", "reference:linux-signal-abi"]
provenance = "original"
semantics = [
  "Deliver a supported nonzero signal to the calling thread using Linux thread-directed delivery.",
  "Return zero and preserve errno on success. Return -1 and set errno on failure.",
]

[abi]
narrow_args = ["edi:s32"]
variadic = false
