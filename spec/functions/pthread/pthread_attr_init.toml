name = "pthread_attr_init"
header = "pthread.h"
prototype = "int pthread_attr_init(pthread_attr_t *attr)"
standard = ["POSIX.1-2024 XSH pthread_attr_init"]
deps = []
errno = ["EINVAL"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:linux-thread-attributes"]
