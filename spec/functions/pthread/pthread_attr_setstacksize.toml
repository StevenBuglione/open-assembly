name = "pthread_attr_setstacksize"
header = "pthread.h"
prototype = "int pthread_attr_setstacksize(pthread_attr_t *attr, size_t stacksize)"
standard = ["POSIX.1-2024 XSH pthread_attr_setstacksize"]
deps = []
errno = ["EINVAL"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:linux-thread-attributes"]
provenance = "original"
semantics = [
  "Store the minimum writable stack size. Reject values below PTHREAD_STACK_MIN without changing the object.",
  "Return zero on success or a positive error number. Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
