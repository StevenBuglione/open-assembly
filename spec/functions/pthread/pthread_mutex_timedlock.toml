name = "pthread_mutex_timedlock"
header = "pthread.h"
prototype = "int pthread_mutex_timedlock(pthread_mutex_t *restrict mutex, const struct timespec *restrict abstime)"
standard = ["POSIX.1-2024 XSH pthread_mutex_timedlock"]
deps = ["__errno_location"]
errno = ["EAGAIN", "EDEADLK", "EINVAL", "ETIMEDOUT"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:linux-thread-mutex"]
provenance = "original"
semantics = [
  "Use an absolute CLOCK_REALTIME deadline when acquisition requires waiting.",
  "Acquire an immediately available mutex without consulting the deadline.",
  "Do not return EINTR. Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
