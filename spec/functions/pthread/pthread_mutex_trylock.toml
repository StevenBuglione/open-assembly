name = "pthread_mutex_trylock"
header = "pthread.h"
prototype = "int pthread_mutex_trylock(pthread_mutex_t *mutex)"
standard = ["POSIX.1-2024 XSH pthread_mutex_trylock"]
deps = ["__errno_location"]
errno = ["EAGAIN", "EBUSY", "EINVAL"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:linux-thread-mutex"]
provenance = "original"
semantics = [
  "Acquire without waiting. An owned nonrecursive mutex reports EBUSY.",
  "Return zero on success or a positive error number. Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
