name = "pthread_mutex_lock"
header = "pthread.h"
prototype = "int pthread_mutex_lock(pthread_mutex_t *mutex)"
standard = ["POSIX.1-2024 XSH pthread_mutex_lock"]
deps = ["__errno_location"]
errno = ["EAGAIN", "EDEADLK", "EINVAL"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:linux-thread-mutex"]
provenance = "original"
semantics = [
  "Acquire the mutex. Block when another thread owns it. Retry signal interruptions internally.",
  "Return zero on success or a positive error number. Preserve errno.",
]

[abi]
narrow_args = []
variadic = false
