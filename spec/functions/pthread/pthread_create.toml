name = "pthread_create"
header = "pthread.h"
prototype = "int pthread_create(pthread_t *restrict thread, const pthread_attr_t *restrict attr, void *(*start)(void *), void *restrict arg)"
standard = ["POSIX.1-2024 XSH pthread_create"]
deps = ["pthread_exit"]
errno = ["EAGAIN", "EINVAL", "EPERM"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:linux-thread-lifecycle"]
provenance = "original"
semantics = [
  "Create a thread with an independent runtime stack and executable TLS.",
  "Use default attributes when attr is null. Otherwise honor detach state and the requested stack and guard sizes.",
  "Invoke start with arg and transport its pointer result to pthread_join.",
  "Publish the handle only on success. Return zero or a positive error and preserve errno.",
]

[abi]
narrow_args = []
variadic = false
