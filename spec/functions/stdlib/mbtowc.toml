name = "mbtowc"
header = "stdlib.h"
prototype = "int mbtowc(wchar_t *restrict pwc, const char *restrict s, size_t n)"
standard = ["C17 7.22.7.2"]
deps = ["__errno_location"]
errno = ["EILSEQ"]
mt_safe = true
as_safe = false
oracles = ["reference:unicode-scalar", "reference:mbstate-transition", "diff:glibc"]
provenance = "original"
semantics = [
  "Decode a complete multibyte character. A null source resets the conversion state and returns zero.",
  "Return minus one and set EILSEQ on invalid input. Preserve errno on success.",
]

[abi]
narrow_args = []
variadic = false
