name = "malloc"
header = "stdlib.h"
prototype = "void *malloc(size_t size)"
standard = ["C17 7.22.3.4"]
deps = ["__errno_location"]
errno = ["ENOMEM"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase3-contract"]
provenance = "original"
semantics = [
  "Return new storage for size bytes with at least 16-byte alignment. Contents are indeterminate.",
  "A zero-byte request can succeed with a distinct freeable pointer. No byte is accessible through that zero-size allocation.",
  "On exhaustion or an unrepresentable allocation size, return NULL and set ENOMEM. Preserve errno on success.",
]

[abi]
narrow_args = []
variadic = false
