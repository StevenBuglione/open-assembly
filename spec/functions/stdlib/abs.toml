name = "abs"
header = "stdlib.h"
prototype = "int abs(int value)"
standard = ["C17 7.22.6.1"]
deps = []
errno = []
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "diff:musl", "reference:lua-posix-abi", "reference:c17-integer-arithmetic"]
provenance = "original"
semantics = [
  "Return the absolute value of the signed integer when the result is representable.",
  "Preserve errno. INT_MIN is outside the C17 contract.",
]

[abi]
narrow_args = ["edi:s32"]
variadic = false
