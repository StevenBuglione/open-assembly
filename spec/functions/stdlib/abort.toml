name = "abort"
header = "stdlib.h"
prototype = "_Noreturn void abort(void)"
standard = ["C17 7.22.4.1"]
deps = ["raise"]
errno = []
mt_safe = true
as_safe = true
oracles = ["diff:glibc", "diff:musl", "reference:lua-posix-abi"]
provenance = "original"
semantics = [
  "Unblock SIGABRT and deliver it to the calling thread.",
  "If the installed disposition returns or ignores the signal, restore its default and deliver it again.",
  "Terminate abnormally without running normal exit callbacks. The abort call does not return.",
]

[abi]
narrow_args = []
variadic = false
noreturn = true
