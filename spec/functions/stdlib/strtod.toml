name = "strtod"
header = "stdlib.h"
prototype = "double strtod(const char *restrict s, char **restrict endptr)"
standard = ["C17 7.22.1.3"]
deps = ["fegetround", "feraiseexcept", "__errno_location"]
errno = ["ERANGE"]
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "reference:mpfr"]
provenance = "original"
semantics = [
  "Consume C-locale whitespace, optional sign, and the longest valid decimal, hexadecimal, infinity or NaN subject.",
  "Round the exact magnitude directly to binary64 using the current floating-point rounding mode.",
  "Set endptr to the first unconsumed byte when provided. On no conversion return positive zero and set endptr to s.",
  "Preserve errno for exact results, ordinary inexact normal results, and no conversion.",
  "Raise inexact for rounding, plus overflow or underflow where applicable. Set ERANGE on overflow or an inexact tiny result.",
  "Preserve the sign of zero and infinity. Accept a valid NaN payload and return a canonical quiet NaN.",
]

[abi]
narrow_args = []
variadic = false
