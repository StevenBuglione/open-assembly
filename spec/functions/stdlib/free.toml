name = "free"
header = "stdlib.h"
prototype = "void free(void *ptr)"
standard = ["C17 7.22.3.3"]
deps = []
errno = []
mt_safe = true
as_safe = false
oracles = ["diff:glibc", "diff:musl", "reference:phase3-contract"]
provenance = "original"
semantics = [
  "Accept NULL or a live allocation pointer returned by the memory allocation family. NULL is a no-op.",
  "Release the allocation and preserve errno. Interior, stale and foreign pointers are outside the contract.",
]

[abi]
narrow_args = []
variadic = false
