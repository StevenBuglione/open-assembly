name = "htonl"
header = "arpa/inet.h"
prototype = "uint32_t htonl(uint32_t value)"
standard = ["POSIX.1-2024 XSH htonl"]
deps = []
errno = []
mt_safe = true
as_safe = false
oracles = ["reference:linux-x86-64-network-abi", "diff:glibc", "diff:musl"]
provenance = "original"
semantics = [
  "Reverse the byte order of a 32-bit integer on x86-64.",
  "Preserve errno.",
]

[abi]
narrow_args = ["edi:u32"]
variadic = false
