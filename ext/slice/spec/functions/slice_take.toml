name = "slice_take"
header = "slice.h"
prototype = "int slice_take(const unsigned char **restrict cursor, size_t *restrict available, size_t length, const unsigned char **restrict result)"
standard = ["Extension ABI slice"]
deps = []
errno = []
mt_safe = true
as_safe = true
