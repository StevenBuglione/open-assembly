name: Tagged release verification

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run the pinned tagged release tier
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./tools/container python3 tools/verify_tiers.py release --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-verification-evidence
          path: build/evidence/
          if-no-files-found: error
