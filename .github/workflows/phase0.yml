name: Assembly verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core runtime and language gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Check protected test paths
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./tools/container tools/gate --protected-base "$BASE_SHA"
      - name: Run pinned Phase 0 through Phase 5 gates
        run: ./tools/container make -k phase0 phase1 phase2 phase3 phase4 phase5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  integration:
    name: Linux integration and BusyBox gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run pinned Phase 6 slice gates
        run: ./tools/container make -k phase6-files phase6-compat phase6-busybox phase6-process phase6-signal phase6-jump phase6-time phase6-calendar phase6-luafiles phase6-spawn phase6-shell phase6-path
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  mathematics:
    name: Real and complex math gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run the independent math suites
        run: ./tools/container make -k phase7-exact phase7-transcendental phase7-complex
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mathematics-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  applications:
    name: Calendar, time zone, and Lua gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run date-formatting, time-zone, and Lua suites
        run: ./tools/container make -k phase6-strftime phase6-zone phase6-lua
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: application-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  threads:
    name: POSIX and C11 thread gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run lifecycle, synchronization, C11, and detector gates
        run: ./tools/container make -k phase8-lifecycle phase8-sync phase8-c11 phase8-openposix phase8-detectors phase8-compiler-atomics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thread-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  locale:
    name: Locale and wide character gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run Unicode, worker-state, and pinned libc-test gates
        run: ./tools/container make -k phase9-multibyte phase9-bulk phase9-worker phase9-worker-sync phase9-wide phase9-wctype phase9-libc-test phase9-stdio phase9-narrow-wide
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: locale-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  real_programs:
    name: zlib, SQLite, and descriptor control gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run pinned applications and the descriptor production gate
        run: ./tools/container make -k phase6-zlib phase6-sqlite phase6-fcntl && ./tools/container make gate FUNC=fcntl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-program-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  network:
    name: Socket, DNS, terminal, and HTTP gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run endpoint, resolver, terminal, and HTTP checks
        run: ./tools/container make -k phase10-endpoints phase10-inet phase10-dns phase10-netdb phase10-terminal phase10-http phase10-libc-test phase10-glob
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: network-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  platform:
    name: Static PIE and CPU dispatch gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run optional static PIE and ELF relocation controls
        run: ./tools/container make -k phase11-static-pie phase11-copy phase11-vdso phase11-allocator phase11-seccomp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: platform-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  acceptance:
    name: acceptance
    if: always()
    needs: [core, integration, mathematics, applications, threads, locale, real_programs, network, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      CORE_RESULT: ${{ needs.core.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      MATH_RESULT: ${{ needs.mathematics.result }}
      APPLICATION_RESULT: ${{ needs.applications.result }}
      THREAD_RESULT: ${{ needs.threads.result }}
      LOCALE_RESULT: ${{ needs.locale.result }}
      REAL_PROGRAMS_RESULT: ${{ needs.real_programs.result }}
      NETWORK_RESULT: ${{ needs.network.result }}
      PLATFORM_RESULT: ${{ needs.platform.result }}
    steps:
      - name: Require all verification jobs
        shell: bash
        run: |
          set -euo pipefail
          printf 'Core: %s\nIntegration: %s\nMathematics: %s\nApplications: %s\nThreads: %s\nLocale: %s\n' \
            "$CORE_RESULT" "$INTEGRATION_RESULT" "$MATH_RESULT" "$APPLICATION_RESULT" "$THREAD_RESULT" "$LOCALE_RESULT"
          test "$CORE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$MATH_RESULT" = success
          test "$APPLICATION_RESULT" = success
          test "$THREAD_RESULT" = success
          test "$LOCALE_RESULT" = success
          printf 'Real programs: %s\n' "$REAL_PROGRAMS_RESULT"
          test "$REAL_PROGRAMS_RESULT" = success
          printf 'Network: %s\n' "$NETWORK_RESULT"
          test "$NETWORK_RESULT" = success
          printf 'Platform: %s\n' "$PLATFORM_RESULT"
          test "$PLATFORM_RESULT" = success
