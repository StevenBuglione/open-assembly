name: Assembly verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core runtime and language gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Check protected test paths
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./tools/container tools/gate --protected-base "$BASE_SHA"
      - name: Run pinned Phase 0 through Phase 5 gates
        run: ./tools/container make -k phase0 phase1 phase2 phase3 phase4 phase5 production-scalars
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  integration:
    name: Linux integration and BusyBox gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run pinned Phase 6 slice gates
        run: ./tools/container make -k phase6-files phase6-compat phase6-busybox phase6-process phase6-signal phase6-jump phase6-time phase6-calendar phase6-luafiles phase6-spawn phase6-shell phase6-path production-linux-files production-linux-io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  process_production:
    name: Process identity and pipe production gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run pinned process identity and descriptor proofs
        timeout-minutes: 20
        run: ./tools/container make -k production-process-identity production-pipes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: process-production-evidence
          path: |
            build/evidence/getpid.production.json
            build/evidence/getppid.production.json
            build/evidence/pipe.production.json
            build/evidence/pipe2.production.json
          if-no-files-found: error

  pathname_production:
    name: Open and pathname production gates
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run full pathname proofs and the scoped getcwd checks
        timeout-minutes: 35
        run: ./tools/container sh -ec 'python3 tests/tooling/test_verification_tiers.py && make -k production-open production-paths verify-getcwd-wrapper'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pathname-production-evidence
          path: |
            build/evidence/open.production.json
            build/evidence/openat.production.json
            build/evidence/readlink.production.json
            build/evidence/unlink.production.json
            build/evidence/rmdir.production.json
            build/evidence/getcwd.getcwd-wrapper.json
          if-no-files-found: error

  wait_exec_production:
    name: Wait and exec production gates
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run full wait and exec proofs and the scoped execvp checks
        timeout-minutes: 35
        run: ./tools/container make -k production-wait production-exec verify-execvp-wrapper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wait-exec-production-evidence
          path: |
            build/evidence/waitpid.production.json
            build/evidence/wait.production.json
            build/evidence/execve.production.json
            build/evidence/execv.production.json
            build/evidence/execvp.execvp-wrapper.json
          if-no-files-found: error

  stat_production:
    name: Stat production and shared record conversion
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Verify exact stat dependencies and full public gates
        timeout-minutes: 35
        run: ./tools/container sh -ec 'python3 tests/tooling/test_stat_dependencies.py && python3 tests/tooling/test_verification_tiers.py && make production-stat'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stat-production-evidence
          path: |
            build/evidence/__errno_location.production.json
            build/evidence/__al_stat_query.production.json
            build/evidence/fstat.production.json
            build/evidence/fstatat.production.json
            build/evidence/stat.production.json
            build/evidence/lstat.production.json
          if-no-files-found: error

  wide_core_production:
    name: Wide string core production gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Verify full wide string core gates
        timeout-minutes: 25
        run: ./tools/container make production-wide-core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wide-core-production-evidence
          path: |
            build/evidence/wcslen.production.json
            build/evidence/wcscmp.production.json
            build/evidence/wcsncmp.production.json
            build/evidence/wmemchr.production.json
          if-no-files-found: error

  stream_indicators:
    name: Scoped stdio stream indicator checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Verify stream indicators with shared ownership pending
        timeout-minutes: 20
        run: ./tools/container sh -ec 'python3 tests/tooling/test_fileno_domain.py && make verify-stream-indicators'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stream-indicator-wrapper-evidence
          path: |
            build/evidence/clearerr.stream-indicator-wrapper.json
            build/evidence/feof.stream-indicator-wrapper.json
            build/evidence/ferror.stream-indicator-wrapper.json
            build/evidence/fileno.stream-indicator-wrapper.json
            build/evidence/stream-indicator-wrappers.json
          if-no-files-found: error

  mathematics:
    name: Real and complex math gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run the independent math suites
        run: ./tools/container make -k phase7-exact phase7-transcendental phase7-complex verify-math-wrappers
      - name: Check operation-specific math campaign binaries
        run: ./tools/container python3 tests/phase7/campaign/test_operation_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mathematics-verification-evidence
          path: |
            build/evidence/
            build/operation-probe-controls/report.json
          if-no-files-found: warn

  applications:
    name: Calendar, time zone, and Lua gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run date-formatting, time-zone, and Lua suites
        run: ./tools/container make -k phase6-strftime phase6-zone phase6-lua
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: application-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  threads:
    name: POSIX and C11 thread gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run lifecycle, fork, synchronization, C11, and detector gates
        run: ./tools/container make -k phase8-lifecycle phase8-fork phase8-sync phase8-c11 phase8-openposix phase8-detectors phase8-compiler-atomics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thread-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  locale:
    name: Locale and wide character gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run Unicode, worker-state, and pinned libc-test gates
        run: ./tools/container make -k phase9-multibyte phase9-bulk phase9-worker phase9-worker-sync phase9-wide phase9-wctype phase9-libc-test phase9-stdio phase9-narrow-wide
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: locale-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  real_programs:
    name: zlib, SQLite, and descriptor control gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run pinned applications and the descriptor production gate
        run: ./tools/container make -k phase6-zlib phase6-sqlite phase6-sqlite-concurrency phase6-fcntl phase10-gnulib phase10-native-ltp && ./tools/container make gate FUNC=fcntl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-program-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  network:
    name: Socket, DNS, terminal, and HTTP gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run endpoint, resolver, terminal, and HTTP checks
        run: ./tools/container make -k phase10-endpoints phase10-inet phase10-dns phase10-netdb phase10-terminal phase10-http phase10-libc-test phase10-glob phase10-regex phase10-addrconfig phase10-dns-failover phase10-dns-options
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: network-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  platform:
    name: Static PIE and CPU dispatch gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run optional static PIE and ELF relocation controls
        run: ./tools/container make -k phase11-static-pie phase11-copy phase11-vdso phase11-allocator phase11-seccomp verify-allocator-wrappers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: platform-verification-evidence
          path: build/evidence/
          if-no-files-found: warn

  extensions:
    name: Assembly extension build and production gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Verify arena, slice, vector, and map
        run: |
          ./tools/container tools/build-extension arena
          ./tools/container tools/extension-gate arena --require-production
          ./tools/container tools/build-extension slice
          ./tools/container tools/extension-gate slice --require-production
          ./tools/container python3 tools/phase2.py memcmp memmove memset --jobs 3
          ./tools/container tools/build-extension vector
          ./tools/container tools/extension-gate vector --require-production
          ./tools/container tools/build-extension map
          ./tools/container tools/extension-gate map --require-production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: extension-verification-evidence
          path: |
            build/evidence/extension-*.json
            build/evidence/memcmp.production.json
            build/evidence/memmove.production.json
            build/evidence/memset.production.json
          if-no-files-found: warn

  extension_formats:
    name: JSON and HTTP extension production gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Verify JSON and HTTP and run the pinned upstream JSON corpus
        run: |
          ./tools/container tools/build-extension json
          ./tools/container tools/extension-gate json --require-production
          ./tools/container make extension-json-upstream
          ./tools/container tools/build-extension http
          ./tools/container tools/extension-gate http --require-production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: format-extension-verification-evidence
          path: build/evidence/extension-*.json
          if-no-files-found: warn

  acceptance:
    name: acceptance
    if: always()
    needs: [core, integration, process_production, pathname_production, wait_exec_production, stat_production, wide_core_production, stream_indicators, mathematics, applications, threads, locale, real_programs, network, platform, extensions, extension_formats]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      CORE_RESULT: ${{ needs.core.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      PROCESS_PRODUCTION_RESULT: ${{ needs.process_production.result }}
      PATHNAME_PRODUCTION_RESULT: ${{ needs.pathname_production.result }}
      WAIT_EXEC_PRODUCTION_RESULT: ${{ needs.wait_exec_production.result }}
      STAT_PRODUCTION_RESULT: ${{ needs.stat_production.result }}
      WIDE_CORE_PRODUCTION_RESULT: ${{ needs.wide_core_production.result }}
      STREAM_INDICATORS_RESULT: ${{ needs.stream_indicators.result }}
      MATH_RESULT: ${{ needs.mathematics.result }}
      APPLICATION_RESULT: ${{ needs.applications.result }}
      THREAD_RESULT: ${{ needs.threads.result }}
      LOCALE_RESULT: ${{ needs.locale.result }}
      REAL_PROGRAMS_RESULT: ${{ needs.real_programs.result }}
      NETWORK_RESULT: ${{ needs.network.result }}
      PLATFORM_RESULT: ${{ needs.platform.result }}
      EXTENSIONS_RESULT: ${{ needs.extensions.result }}
      FORMATS_RESULT: ${{ needs.extension_formats.result }}
    steps:
      - name: Require all verification jobs
        shell: bash
        run: |
          set -euo pipefail
          printf 'Core: %s\nIntegration: %s\nMathematics: %s\nApplications: %s\nThreads: %s\nLocale: %s\n' \
            "$CORE_RESULT" "$INTEGRATION_RESULT" "$MATH_RESULT" "$APPLICATION_RESULT" "$THREAD_RESULT" "$LOCALE_RESULT"
          test "$CORE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          printf 'Process production: %s\n' "$PROCESS_PRODUCTION_RESULT"
          test "$PROCESS_PRODUCTION_RESULT" = success
          printf 'Pathname production: %s\nWait and exec production: %s\n' "$PATHNAME_PRODUCTION_RESULT" "$WAIT_EXEC_PRODUCTION_RESULT"
          test "$PATHNAME_PRODUCTION_RESULT" = success
          test "$WAIT_EXEC_PRODUCTION_RESULT" = success
          printf 'Stat production: %s\nWide core production: %s\n' "$STAT_PRODUCTION_RESULT" "$WIDE_CORE_PRODUCTION_RESULT"
          test "$STAT_PRODUCTION_RESULT" = success
          test "$WIDE_CORE_PRODUCTION_RESULT" = success
          printf 'Scoped stream indicators: %s\n' "$STREAM_INDICATORS_RESULT"
          test "$STREAM_INDICATORS_RESULT" = success
          test "$MATH_RESULT" = success
          test "$APPLICATION_RESULT" = success
          test "$THREAD_RESULT" = success
          test "$LOCALE_RESULT" = success
          printf 'Real programs: %s\n' "$REAL_PROGRAMS_RESULT"
          test "$REAL_PROGRAMS_RESULT" = success
          printf 'Network: %s\n' "$NETWORK_RESULT"
          test "$NETWORK_RESULT" = success
          printf 'Platform: %s\n' "$PLATFORM_RESULT"
          test "$PLATFORM_RESULT" = success
          printf 'Extensions: %s\n' "$EXTENSIONS_RESULT"
          test "$EXTENSIONS_RESULT" = success
          printf 'JSON and HTTP extensions: %s\n' "$FORMATS_RESULT"
          test "$FORMATS_RESULT" = success
