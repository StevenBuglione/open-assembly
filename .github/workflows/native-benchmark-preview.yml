name: Native performance preview

on:
  push:
    branches: [libc/phase11-native-benchmark]

permissions:
  contents: read

jobs:
  memcpy:
    name: Native memcpy comparison with pinned musl
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Run the predeclared paired benchmark
        run: ./tools/container make phase11-copy-benchmark
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-memcpy-benchmark-evidence
          path: build/evidence/phase11-copy-benchmark.json
          if-no-files-found: error
